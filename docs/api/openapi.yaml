openapi: 3.0.3
info:
  title: U-Trade API
  version: 1.2.0
  description: 'API REST de U-Trade v1.2. Autenticación por sesión Django + CSRF.
    Errores uniformes: {"code", "message", "details"}. Fechas en UTC ISO-8601.'
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: Emite la cookie csrftoken.
  /api/v1/auth/email-otp/request/:
    post:
      operationId: auth_email_otp_request
      summary: Envía un OTP de 6 dígitos al correo de registro (BUYER_EMAIL).
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPRequestResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/email-otp/verify/:
    post:
      operationId: auth_email_otp_verify
      summary: 'Verifica el OTP BUYER_EMAIL (atajo: @uisek.edu.ec verifica también
        UISEK).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPCodeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Sin contenido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'NOT_AUTHENTICATED: no hay sesión activa.'
    patch:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/me/delete/:
    post:
      operationId: auth_me_delete
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Sin contenido.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/password-change/:
    post:
      operationId: auth_password_change
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Sin contenido.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: Sin contenido.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/password-reset/request/:
    post:
      operationId: auth_password_reset_request
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: Sin contenido.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/cron/sweep/:
    post:
      operationId: cron_sweep
      description: Barrido periódico invocado por GitHub Actions. El middleware exige
        X-Cron-Secret.
      tags:
      - core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronSweepResponse'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_check
      description: Health check público (exento del secreto de proxy). Solo lectura.
      tags:
      - core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailableResponse'
          description: ''
  /api/v1/sellers/{id}/:
    get:
      operationId: sellers_profile_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sellers
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerPublicProfile'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'NOT_FOUND: no existe o no está activo.'
  /api/v1/sellers/applications/:
    post:
      operationId: sellers_applications_create
      tags:
      - sellers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerApplicationCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerApplication'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sellers/applications/me/:
    get:
      operationId: sellers_applications_me
      description: Devuelve todas las solicitudes ordenadas por -created_at. El primer
        elemento es la solicitud vigente; lista vacía si el usuario nunca postuló.
      summary: Solicitudes del usuario, de la más reciente a la más antigua.
      tags:
      - sellers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SellerApplication'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sellers/me/:
    get:
      operationId: sellers_me_retrieve
      summary: Perfil completo del vendedor autenticado (incluye contact_phone).
      tags:
      - sellers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOwnProfile'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    patch:
      operationId: sellers_me_update
      tags:
      - sellers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSellerProfileUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOwnProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sellers/uisek-otp/request/:
    post:
      operationId: sellers_uisek_otp_request
      summary: Envía un OTP al correo institucional @uisek.edu.ec (UISEK_SELLER).
      tags:
      - sellers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UisekOTPRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPRequestResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sellers/uisek-otp/verify/:
    post:
      operationId: sellers_uisek_otp_verify
      summary: Verifica el OTP UISEK_SELLER y vincula el correo institucional.
      tags:
      - sellers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPCodeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
components:
  schemas:
    AccountDeleteRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - current_password
    CronSweepResponse:
      type: object
      properties:
        status:
          type: string
        processed:
          type: integer
      required:
      - processed
      - status
    ErrorCodeEnum:
      enum:
      - VALIDATION_ERROR
      - PARSE_ERROR
      - NOT_AUTHENTICATED
      - PERMISSION_DENIED
      - CSRF_FAILED
      - NOT_FOUND
      - METHOD_NOT_ALLOWED
      - NOT_ACCEPTABLE
      - UNSUPPORTED_MEDIA_TYPE
      - THROTTLED
      - INTERNAL_ERROR
      - FORBIDDEN_PROXY
      - UNAUTHORIZED
      - CONSENT_REQUIRED
      - DISPOSABLE_EMAIL
      - EMAIL_ALREADY_REGISTERED
      - INVALID_CREDENTIALS
      - INVALID_PASSWORD
      - INVALID_RESET_TOKEN
      - EMAIL_ALREADY_VERIFIED
      - UISEK_ALREADY_VERIFIED
      - UISEK_EMAIL_ALREADY_IN_USE
      - INVALID_UISEK_EMAIL
      - OTP_INVALID
      - OTP_EXPIRED_OR_INVALID
      - OTP_LOCKED
      - OTP_RATE_LIMITED
      - UISEK_NOT_VERIFIED
      - ALREADY_A_SELLER
      - SELLER_APPLICATION_ALREADY_PENDING
      - SELLER_APPLICATION_NOT_PENDING
      - REJECTION_REASON_REQUIRED
      - NOT_A_SELLER
      type: string
      description: |-
        * `VALIDATION_ERROR` - Validation Error
        * `PARSE_ERROR` - Parse Error
        * `NOT_AUTHENTICATED` - Not Authenticated
        * `PERMISSION_DENIED` - Permission Denied
        * `CSRF_FAILED` - Csrf Failed
        * `NOT_FOUND` - Not Found
        * `METHOD_NOT_ALLOWED` - Method Not Allowed
        * `NOT_ACCEPTABLE` - Not Acceptable
        * `UNSUPPORTED_MEDIA_TYPE` - Unsupported Media Type
        * `THROTTLED` - Throttled
        * `INTERNAL_ERROR` - Internal Error
        * `FORBIDDEN_PROXY` - Forbidden Proxy
        * `UNAUTHORIZED` - Unauthorized
        * `CONSENT_REQUIRED` - Consent Required
        * `DISPOSABLE_EMAIL` - Disposable Email
        * `EMAIL_ALREADY_REGISTERED` - Email Already Registered
        * `INVALID_CREDENTIALS` - Invalid Credentials
        * `INVALID_PASSWORD` - Invalid Password
        * `INVALID_RESET_TOKEN` - Invalid Reset Token
        * `EMAIL_ALREADY_VERIFIED` - Email Already Verified
        * `UISEK_ALREADY_VERIFIED` - Uisek Already Verified
        * `UISEK_EMAIL_ALREADY_IN_USE` - Uisek Email Already In Use
        * `INVALID_UISEK_EMAIL` - Invalid Uisek Email
        * `OTP_INVALID` - Otp Invalid
        * `OTP_EXPIRED_OR_INVALID` - Otp Expired Or Invalid
        * `OTP_LOCKED` - Otp Locked
        * `OTP_RATE_LIMITED` - Otp Rate Limited
        * `UISEK_NOT_VERIFIED` - Uisek Not Verified
        * `ALREADY_A_SELLER` - Already A Seller
        * `SELLER_APPLICATION_ALREADY_PENDING` - Seller Application Already Pending
        * `SELLER_APPLICATION_NOT_PENDING` - Seller Application Not Pending
        * `REJECTION_REASON_REQUIRED` - Rejection Reason Required
        * `NOT_A_SELLER` - Not A Seller
    ErrorResponse:
      type: object
      description: Formato uniforme de errores de la API (solo documentación OpenAPI).
      properties:
        code:
          $ref: '#/components/schemas/ErrorCodeEnum'
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - code
      - details
      - message
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        server_time:
          type: string
          format: date-time
      required:
      - database
      - server_time
      - status
    HealthUnavailableResponse:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        server_time:
          type: string
          format: date-time
      required:
      - database
      - server_time
      - status
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    OTPCodeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 6
          pattern: ^\d{6}$
      required:
      - code
    OTPRequestResponse:
      type: object
      properties:
        purpose:
          allOf:
          - $ref: '#/components/schemas/PurposeEnum'
          readOnly: true
        target_email:
          type: string
          format: email
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - expires_at
      - purpose
      - target_email
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - current_password
      - new_password
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 64
        token:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - new_password
      - token
      - uid
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    PatchedProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 20
    PatchedSellerProfileUpdateRequest:
      type: object
      description: logo_url/logo_public_id no son editables todavía (validación Cloudinary
        en Orden 4).
      properties:
        venture_name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        contact_phone:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^\+?[0-9][0-9 \-]{6,18}$
    PurposeEnum:
      enum:
      - BUYER_EMAIL
      - UISEK_SELLER
      type: string
      description: |-
        * `BUYER_EMAIL` - Correo personal del comprador
        * `UISEK_SELLER` - Correo institucional del vendedor
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        full_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 20
        accept_terms:
          type: boolean
        accept_privacy:
          type: boolean
      required:
      - accept_privacy
      - accept_terms
      - email
      - password
    SellerApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        venture_name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        contact_phone:
          type: string
          readOnly: true
        instagram_handle:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        rejection_reason:
          type: string
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contact_phone
      - created_at
      - description
      - id
      - instagram_handle
      - rejection_reason
      - reviewed_at
      - status
      - venture_name
    SellerApplicationCreateRequest:
      type: object
      properties:
        venture_name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        contact_phone:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^\+?[0-9][0-9 \-]{6,18}$
        instagram_handle:
          oneOf:
          - type: string
            default: ''
            maxLength: 31
            pattern: ^@?[A-Za-z0-9._]{1,30}$
          - type: string
            maxLength: 0
      required:
      - contact_phone
      - description
      - venture_name
    SellerOwnProfile:
      type: object
      description: Perfil completo visible solo para el propio vendedor.
      properties:
