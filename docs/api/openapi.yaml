        expone por simetría de responsabilidad junto a avg_rating y reviews_count.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        venture_name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        logo_url:
          type: string
          format: uri
