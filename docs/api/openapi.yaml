openapi: 3.0.3
info:
  title: U-Trade API
  version: 1.2.0
  description: 'API REST de U-Trade v1.2. Autenticación por sesión Django + CSRF.
    Errores uniformes: {"code", "message", "details"}. Fechas en UTC ISO-8601.'
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: Emite la cookie csrftoken.
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Sin contenido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
    patch:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/me/delete/:
    post:
      operationId: auth_me_delete
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Sin contenido.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/password-change/:
    post:
      operationId: auth_password_change
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Sin contenido.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: Sin contenido.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/password-reset/request/:
    post:
      operationId: auth_password_reset_request
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: Sin contenido.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/cron/sweep/:
    post:
      operationId: cron_sweep
      description: Barrido periódico invocado por GitHub Actions. El middleware exige
        X-Cron-Secret.
      tags:
      - core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronSweepResponse'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_check
      description: Health check público (exento del secreto de proxy). Solo lectura.
      tags:
      - core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailableResponse'
          description: ''
components:
  schemas:
    AccountDeleteRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - current_password
    CronSweepResponse:
      type: object
      properties:
        status:
          type: string
        processed:
          type: integer
      required:
      - processed
      - status
    ErrorResponse:
      type: object
      description: Formato uniforme de errores de la API (solo documentación OpenAPI).
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - code
      - details
      - message
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        server_time:
          type: string
          format: date-time
      required:
      - database
      - server_time
      - status
    HealthUnavailableResponse:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        server_time:
          type: string
          format: date-time
      required:
      - database
      - server_time
      - status
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - current_password
      - new_password
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 64
        token:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - new_password
      - token
      - uid
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    PatchedProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 20
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        full_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 20
        accept_terms:
          type: boolean
        accept_privacy:
          type: boolean
      required:
      - accept_privacy
      - accept_terms
      - email
      - password
    UserMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        uisek_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        uisek_email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_email_verified:
          type: boolean
          readOnly: true
        is_uisek_verified:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - email_verified_at
      - full_name
      - id
      - is_email_verified
      - is_staff
      - is_uisek_verified
      - phone_number
      - uisek_email
      - uisek_email_verified_at
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
