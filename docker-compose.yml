services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: u-trade-backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env

  # PostgreSQL 16 local y desechable SOLO para pytest. Opcional: no arranca con `docker compose up`.
  # Uso: docker compose --profile test up -d postgres-test
  postgres-test:
    image: postgres:16
    container_name: u-trade-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: utrade
      POSTGRES_PASSWORD: utrade
      POSTGRES_DB: utrade_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utrade -d utrade_test"]
      interval: 2s
      timeout: 3s
      retries: 15
