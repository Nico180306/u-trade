name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + pytest PG16 + OpenAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: utrade
          POSTGRES_PASSWORD: utrade
          POSTGRES_DB: utrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utrade -d utrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgres://utrade:utrade@localhost:5432/utrade_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Migraciones completas
        run: python manage.py makemigrations --check --dry-run

      - name: Pytest (PostgreSQL 16)
        run: pytest

      - name: Validar y regenerar OpenAPI
        run: python manage.py spectacular --validate --fail-on-warn --file ../docs/api/openapi.yaml

      - name: Contrato OpenAPI versionado y sincronizado
        run: git diff --exit-code -- ../docs/api/openapi.yaml
