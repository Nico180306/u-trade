name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + pytest PG16 + OpenAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: utrade
          POSTGRES_PASSWORD: utrade
          POSTGRES_DB: utrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utrade -d utrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgres://utrade:utrade@localhost:5432/utrade_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Migraciones completas
        run: python manage.py makemigrations --check --dry-run

      - name: Pytest (PostgreSQL 16)
        run: pytest

      - name: Validar y regenerar OpenAPI
        run: python manage.py spectacular --validate --fail-on-warn --file ../docs/api/openapi.yaml

      - name: Contrato OpenAPI versionado y sincronizado
        run: git diff --exit-code -- ../docs/api/openapi.yaml

  governance:
    name: governance (AGENTS / CLAUDE / .agent parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar existencia de archivos de gobernanza
        run: |
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f .agent/rules/utrade.md

      - name: Verificar paridad exacta entre AGENTS.md, CLAUDE.md y .agent/rules/utrade.md
        run: |
          diff -u AGENTS.md CLAUDE.md
          diff -u AGENTS.md .agent/rules/utrade.md

  frontend:
    name: frontend (Node 24 + lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
